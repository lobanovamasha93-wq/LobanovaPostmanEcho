# Образ ОС с предустановленной Java и инструментами сборки
image: Visual Studio 2022

# Установка переменных окружения (выбираем версию JDK)
environment:
  matrix:
    - JAVA_HOME: C:\Program Files\Java\jdk11

# Ветви для мониторинга
branches:
  only:
    - master
    - main

# Скрипт сборки
# На Windows используем gradlew.bat
build_script:
  - gradlew.bat clean test --info

# Настройки тестирования
test:
  assemble_jar: false

# Сохранение артефактов (отчетов о тестах)
artifacts:
  - path: build\reports\tests\test
    name: TestReport
    type: zip

# Настройка уведомлений
notifications:
  - provider: Email
    on_build_success: false
    on_build_failure: true
